<style>

y:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.lane{--accent:var(--blue);background:#14243a;border:1px solid #3b526e;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.lane:nth-child(2){--accent:var(--mint)}.lane:nth-child(3){--accent:var(--gold)}.lane-head{background:#1d3049;border-bottom:1px solid #39516c;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.role{font-weight:800;font-size:1.15rem;color:var(--accent)}.student{font-size:.85rem;color:var(--muted)}.lane-body{padding:18px 20px;flex:1}.task{margin:0 0 16px;line-height:1.6;font-size:1.05rem;min-height:3.2em}.question{margin-bottom:18px}.question-label{color:#c4d6eb;display:block;margin-bottom:9px}.choices{display:grid;gap:9px;grid-template-columns:repeat(2,minmax(0,1fr))}.choices.long{grid-template-columns:1fr}.choice{padding:12px;min-height:62px;font-size:1.08rem;line-height:1.45;background:#1a2e47;border-color:#405a77;font-weight:500}.choice.selected{border-color:var(--accent);background:#2b4256;box-shadow:inset 0 0 0 2px var(--accent);color:white}.lane-foot{padding:0 20px 20px}.ready{width:100%;background:#294866;min-height:60px}.status{min-height:2.7em;font-size:.9rem;line-height:1.4;color:var(--muted);margin:0 0 10px}.status.good{color:var(--mint)}.status.bad{color:#ffb2b2}.lane.correct{border-color:var(--mint)}.lane.correct .ready{background:#19473e;color:var(--mint)}.plot{width:100%;display:block;background:#0b1b2c;border:1px solid #344b64;border-radius:14px;touch-action:none;user-select:none}.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:.8rem;margin:8px 0 12px}.legend b{color:var(--mint)}.slider-wrap{margin:17px 0}.slider-title{display:flex;justify-content:space-between;gap:8px;color:#cbd9eb}.slider-title output{font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums}.slider{position:relative;min-height:64px;touch-action:none;user-select:none;cursor:ew-resize}.track{position:absolute;top:29px;left:18px;right:18px;height:8px;border-radius:5px;background:#3c536d}.fill{height:100%;background:var(--mint);border-radius:5px}.knob{position:absolute;top:13px;width:40px;height:40px;border-radius:50%;background:var(--mint);border:4px solid #b9fff1;transform:translateX(-50%);box-shadow:0 0 0 5px #4de2cb1a}.slider-help{font-size:.8rem;color:var(--muted)}.bottom{display:flex;align-items:center;gap:15px;margin-top:18px;flex-wrap:wrap}.message{flex:1;line-height:1.6;font-size:1rem;color:#c8d9eb}.score{background:#21354e;border:1px solid #425a75;border-radius:12px;padding:12px 20px;white-space:nowrap}.score strong{color:var(--gold);font-size:1.4rem}.hint{padding:16px 20px;margin:14px 0 0;border-left:4px solid var(--gold);background:#26313c;line-height:1.65;color:#ffdf9e}.overlay{position:fixed;inset:0;background:#05101bd9;z-index:10;display:grid;place-items:center;padding:25px;overflow:auto}.dialog{width:min(800px,100%);background:#192d45;border:1px solid #6684a4;border-radius:24px;padding:30px;box-shadow:0 30px 100px #0008;max-height:90vh;overflow:auto}.dialog h2{font-size:1.7rem;margin:0 0 14px}.dialog p,.dialog li{line-height:1.8}.dialog .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}.dialog input{width:100%;background:#0c1d30;border:1px solid #6285a7;border-radius:10px;color:white;padding:15px;margin-top:8px}.pill{display:inline-block;border:1px solid #66829e;border-radius:30px;padding:5px 13px;margin-right:7px;color:var(--mint)}.summary{text-align:center}.summary .big-score{font-size:4rem;color:var(--gold);font-weight:850;margin:10px 0}.result-row{display:flex;justify-content:space-between;border-bottom:1px solid #3b5470;padding:12px 0}.pause-banner{position:fixed;inset:0;z-index:9;background:#081322e8;display:grid;place-items:center;text-align:center}.pause-banner h2{font-size:3rem}.note{font-size:.85rem;color:var(--muted)}[hidden]{display:none!important}@media(min-width:1600px){:root{font-size:22px}.lane-body{padding:22px 26px}.choice{min-height:72px}.lane-foot{padding:0 26px 24px}.plot{max-height:265px}.task{min-height:3em}}@media(max-width:1050px){header,.shell{padding-left:16px;padding-right:16px}.mission{align-items:flex-start;flex-direction:column;gap:12px}.equation{margin:0;white-space:normal}.lanes{gap:10px}.lane-body{padding:14px}.lane-head{padding:14px}.lane-foot{padding:0 14px 14px}.choices{grid-template-columns:1fr}.brand{font-size:1.1rem}}@media(max-width:700px){.lanes{grid-template-columns:1fr}.progress{gap:3px}.step{padding:9px 4px;font-size:.75rem}.toolbar{margin-left:0}.task{min-height:0}.equation{font-size:1.25rem}.mission h1{font-size:1.4rem}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.plot{max-height:280px}.dialog{padding:22px}.bottom{align-items:stretch}.message{flex-basis:100%}}
@media(min-width:1051px){.task{min-height:0}.status{min-height:1.5em}.question{margin-bottom:14px}.slider-wrap{margin:10px 0}.slider{min-height:54px}.plot{max-height:190px}header{padding-top:14px}.progress{margin-bottom:12px}.mission{margin-bottom:16px}.step{padding:10px 15px}.bottom{margin-top:12px}}
@media(min-width:1600px){:root{font-size:18px}.lane-body{padding:16px 24px}.choice{min-height:60px}.plot{max-height:190px}.lane-foot{padding:0 24px 16px}}

<body>
<header><div class="brand">正餘弦<span>探險</span> <span class="note">三人合作闖關</span></div><div class="toolbar"><span id="teamLabel">探索小隊</span><span class="clock" id="clock">00:00</span><button class="small quiet" id="pause">暫停</button><button class="small quiet" id="fullscreen">全螢幕</button><button class="small quiet" id="teacher">教師控制</button></div></header>
<main class="shell"><nav class="progress" aria-label="闖關進度" id="progress"></nav><section class="mission"><div><h1 id="title"></h1><p id="intro"></p></div><div class="equation" id="equation"></div></section><section class="lanes" id="lanes" aria-label="三人操作區"></section><div class="hint" id="hint" hidden></div><footer class="bottom"><div class="score">合作積分 <strong id="score">0</strong> / 15</div><div class="message" id="message" aria-live="polite">每人完成自己的任務，再按「準備好了」。</div><button id="help" class="quiet">玩法</button><button id="next" class="primary" disabled>下一關</button></footer><p class="note">三人同時操作：各自在自己的區域點選或拖動；每關換位，輪流體驗三種任務。</p></main>
<div class="overlay" id="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="dialog"></section></div>
<div class="pause-banner" id="paused" hidden><div><h2>討論時間</h2><p>計時已暫停，準備好再繼續。</p><button class="primary" id="resume">繼續挑戰</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), PI=Math.PI;
const stages=[
 {name:'波形合體',intro:'兩條波相加，最高點會在哪裡？三人一起破解振幅。',eq:'y = sin x + cos x',roles:['公式師','圖形師','驗證師'],tasks:['選出合成波振幅的計算式與精確值。','拖動滑桿，讓綠色波與白色目標波重合。','找出為什麼最大值不是 2。'],left:[{label:'振幅計算式',options:['1 + 1','√(1² + 1²)','1² + 1²','√(1 + 1² + 1)'],answer:1},{label:'振幅的精確值',options:['1','2','√2','1/2'],answer:2}],right:[{label:'選出正確理由',options:['sin x 與 cos x 可同時等於 1','sin x 與 cos x 不會在同一個 x 同時等於 1','疊合後週期變成 π','兩條波相加後振幅一定不變'],answer:1}],sliders:[{label:'合成波振幅 R',min:1,max:2.5,step:.01,initial:2,format:v=>v.toFixed(2),target:Math.SQRT2,tol:.045}],hint:'展開 R sin(x + θ)，比較 sin x、cos x 的係數；R² = a² + b²。',explain:'sin x + cos x = √2 sin(x + π/4)。振幅是 √2，最大值是 √2，週期仍為 2π。',midTip:'白色虛線：目標波　綠色：你調整的波'},
 {name:'相位密碼',intro:'振幅、平移、算式必須吻合，才能打開密碼門。',eq:'y = √3 sin x + cos x',tasks:['選出振幅與疊合角的三角比。','調整水平平移，讓兩條波重合。','找出疊合式與正確的平移方向。'],left:[{label:'振幅 R',options:['√3 + 1','2','4','√3'],answer:1},{label:'(cos θ, sin θ)',options:['(1/2, √3/2)','(√3/2, −1/2)','(√3/2, 1/2)','(1, 1)'],answer:2}],right:[{label:'疊合式',options:['2 sin(x + π/6)','2 sin(x − π/6)','2 sin(x + π/3)','√3 sin(x + π/6)'],answer:0},{label:'相對於 y = 2 sin x',options:['向右平移 π/6','向左平移 π/6','向左平移 π/3','不平移'],answer:1}],sliders:[{label:'水平平移 h（y = 2 sin(x − h)）',min:-6,max:6,step:1,initial:2,format:v=>angle(v,12),target:-2,tol:0}],hint:'R cos θ = √3、R sin θ = 1。x + π/6 表示向左平移，滑桿 h 要取負值。',explain:'√3 sin x + cos x = 2 sin(x + π/6)。振幅 2，向左平移 π/6；滑桿 h = −π/6。',midTip:'負值向左移，正值向右移；每格是 π/12。'},
 {name:'極值寶箱',intro:'x 不受限制。找出最高與最低的寶箱高度。',eq:'y = 3 sin x − 4 cos x',tasks:['計算振幅，並判斷圖形的中線。','分別調整兩個滑桿，標示最大與最小值。','說明極值為什麼可以取到。'],left:[{label:'振幅 R',options:['7','1','5','25'],answer:2},{label:'圖形中線',options:['y = 3','y = −4','y = 1','y = 0'],answer:3}],right:[{label:'正確理由',options:['sin x 與 cos x 同時取最大值','x 不受限制，疊合後的正弦值可取到 1 和 −1','負的 cos x 會讓週期改變','振幅就是最大值減最小值'],answer:1}],sliders:[{label:'最大值寶箱',min:-6,max:6,step:1,initial:2,format:v=>String(v),target:5,tol:0},{label:'最小值寶箱',min:-6,max:6,step:1,initial:-2,format:v=>String(v),target:-5,tol:0}],hint:'R = √(3² + (−4)²)，沒有上下平移。當 x 不受限制，正弦值可以取遍 [−1, 1]。',explain:'振幅 √(9 + 16) = 5，中線 y = 0，所以最大值 5、最小值 −5。',midTip:'藍線：原函數　綠線：最大值標記　金線：最小值標記'},
 {name:'範圍結界',intro:'只准在 0 ≤ x ≤ π 探索。波谷可能在結界外！',eq:'y = sin x − √3 cos x + 5',tasks:['選出疊合式與正確的極值。','拖動兩個位置標記，指出最大與最小值的 x。','檢查原來的波谷是否落在允許範圍。'],left:[{label:'疊合式',options:['2 sin(x + π/3) + 5','2 sin(x − π/3) + 5','√3 sin(x − π/3) + 5','2 sin(x − π/6) + 5'],answer:1},{label:'(最大值, 最小值)',options:['(7, 3)','(5 + √3, 3)','(7, 5 − √3)','(7, 5)'],answer:2}],right:[{label:'最小值為什麼不是 3？',options:['振幅不再是 2','原函數的波谷 x = 11π/6 不在 [0, π]，要比較範圍內候選點','上下平移改變週期','限制範圍會讓所有極值都消失'],answer:1}],sliders:[{label:'最大值的位置 x',min:0,max:6,step:1,initial:3,format:v=>angle(v,6),target:5,tol:0},{label:'最小值的位置 x',min:0,max:6,step:1,initial:2,format:v=>angle(v,6),target:0,tol:0}],hint:'令 t = x − π/3，則 −π/3 ≤ t ≤ 2π/3。比較區間內的波峰和兩個端點。',explain:'最大值 7，出現在 x = 5π/6；最小值 5 − √3，出現在 x = 0。另一端點 x = π 的值為 5 + √3。',midTip:'每格是 π/6；綠點標最大值，金點標最小值。'},
 {name:'窗花任務',intro:'圓的直徑固定為 100 公分。合作設計周長最大的內接矩形。',eq:'P = 200(sin x + cos x)',tasks:['建立矩形周長公式，並將它疊合。','拖動圓上的綠色頂點，找出周長最大的矩形。','提交最佳角度與最大周長的精確值。'],left:[{label:'矩形周長',options:['100(sin x + cos x)','200 sin x cos x','200(sin x + cos x)','100 sin x + 200 cos x'],answer:2},{label:'周長的疊合式',options:['200√2 sin(x + π/4)','200 sin(x + π/4)','200√2 sin(x − π/4)','400 sin(x + π/4)'],answer:0}],right:[{label:'最佳角度 x',options:['π/6','π/4','π/3','π/2'],answer:1},{label:'最大周長（公分）',options:['200','400','100√2','200√2'],answer:3}],sliders:[{label:'角度 x（0° < x < 90°）',min:1,max:89,step:1,initial:20,format:v=>v+'°',target:45,tol:2}],hint:'矩形的對角線為 100；兩邊長為 100 sin x 和 100 cos x。當 sin(x + π/4) = 1 時周長最大。',explain:'P = 200√2 sin(x + π/4)。x = π/4（45°）時矩形是正方形，最大周長為 200√2 公分。',midTip:'可拖曳綠色頂點或使用滑桿；接近 45°（±2°）即接受。'}
];
let level=0,answers=[[],[],[]],values=[],ready=[false,false,false],correct=[false,false,false],passed=false,scores=[0,0,0,0,0],bonuses=[false,false,false,false,false],started=false,paused=false,seconds=0,team='探索小隊',modalReturn=null;
function gcd(a,b){return b?gcd(b,a%b):a}
function angle(n,d){if(n===0)return '0';let g=gcd(Math.abs(n),d);n/=g;d/=g;return (n<0?'−':'')+(Math.abs(n)===1?'':Math.abs(n))+'π'+(d===1?'':'/'+d)}
function resetStage(){answers=[[],[],[]];ready=[false,false,false];correct=[false,false,false];passed=scores[level]>0;values=stages[level].sliders.map(s=>s.initial);$('#hint').hidden=true;render()}
function render(){let s=stages[level];$('#title').textContent=`0${level+1} / ${s.name}`;$('#intro').textContent=s.intro;$('#equation').textContent=s.eq;$('#progress').innerHTML=stages.map((s,i)=>`<div class="step ${i===level?'active':scores[i]?'done':''}">${scores[i]?'✓ ':''}${i+1} ${s.name}</div>`).join('');$('#lanes').innerHTML=[0,1,2].map(i=>`<article class="lane" id="lane${i}"><div class="lane-head"><span class="role">${['公式師','圖形師','驗證師'][i]}</span><span class="student">學生 ${((i+level)%3)+1}</span></div><div class="lane-body"><p class="task">${s.tasks[i]}</p>${i===1?middleHTML(s):questionHTML(i,i===0?s.left:s.right)}</div><div class="lane-foot"><p class="status" id="status${i}" aria-live="polite">${i===1?'調整後按準備好了。':'請完成上方所有選擇。'}</p><button class="ready" data-ready="${i}">準備好了</button></div></article>`).join('');$('#message').textContent=passed?'此關已完成，可繼續下一關。':'每人完成自己的任務，再按「準備好了」。';$('#next').disabled=!passed;$('#next').textContent=level===4?'完成探險':'下一關 · 換位';$('#score').textContent=scores.reduce((a,b)=>a+b,0);bind();updatePlot();s.sliders.forEach((s,i)=>updateSlider(i));}
function questionHTML(lane,qs){return qs.map((q,j)=>`<div class="question"><span class="question-label">${q.label}</span><div class="choices ${q.options.some(o=>o.length>23)?'long':''}" role="group" aria-label="${q.label}">${q.options.map((o,k)=>`<button class="choice" aria-pressed="false" data-lane="${lane}" data-q="${j}" data-option="${k}">${o}</button>`).join('')}</div></div>`).join('')}
function middleHTML(s){return `<svg class="plot" id="plot" viewBox="0 0 460 240" role="img" aria-label="${level===4?'圓內接矩形操作圖':'函數圖形'}"></svg><div class="legend"><b>● 操作區</b><span>${s.midTip}</span></div>${s.sliders.map((v,i)=>`<div class="slider-wrap"><div class="slider-title"><label id="sliderLabel${i}">${v.label}</label><output id="out${i}"></output></div><div class="slider" id="slider${i}" role="slider" aria-labelledby="sliderLabel${i}" tabindex="0" aria-valuemin="${v.min}" aria-valuemax="${v.max}" aria-valuenow="${v.initial}"><div class="track"><div class="fill" id="fill${i}"></div></div><div class="knob" id="knob${i}"></div></div></div>`).join('')}`}
function bind(){document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{let i=+b.dataset.lane,j=+b.dataset.q,k=+b.dataset.option;answers[i][j]=k;b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');invalidate(i)});document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>submit(+b.dataset.ready));stages[level].sliders.forEach((s,i)=>{let el=$('#slider'+i),pointer=null;let move=e=>{let r=el.getBoundingClientRect(),t=Math.max(0,Math.min(1,(e.clientX-r.left-18)/(r.width-36)));setValue(i,s.min+t*(s.max-s.min))};el.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;el.setPointerCapture(pointer);move(e)};el.onpointermove=e=>{if(e.pointerId===pointer)move(e)};el.onpointerup=el.onpointercancel=e=>{if(e.pointerId===pointer)pointer=null};el.onkeydown=e=>{let v=values[i];if(e.key==='ArrowLeft'||e.key==='ArrowDown')v-=s.step;else if(e.key==='ArrowRight'||e.key==='ArrowUp')v+=s.step;else if(e.key==='Home')v=s.min;else if(e.key==='End')v=s.max;else return;e.preventDefault();setValue(i,v)}});if(level===4){let p=$('#plot'),pointer=null;const move=e=>{let r=p.getBoundingClientRect(),scale=Math.min(r.width/460,r.height/240),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/scale,y=(cy-e.clientY)/scale;setValue(0,Math.atan2(Math.max(1,y),Math.max(1,x))*180/PI)};p.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;p.setPointerCapture(pointer);move(e)};p.onpointermove=e=>{if(e.pointerId===pointer)move(e)};p.onpointerup=p.onpointercancel=e=>{if(e.pointerId===pointer)pointer=null}}}
function setValue(i,v){let s=stages[level].sliders[i];values[i]=Math.max(s.min,Math.min(s.max,Math.round((v-s.min)/s.step)*s.step+s.min));updateSlider(i);updatePlot();invalidate(1)}
function updateSlider(i){let s=stages[level].sliders[i],el=$('#slider'+i),t=(values[i]-s.min)/(s.max-s.min);$('#out'+i).textContent=s.format(values[i]);el.setAttribute('aria-valuenow',values[i]);el.setAttribute('aria-valuetext',s.format(values[i]));$('#fill'+i).style.width=t*100+'%';$('#knob'+i).style.left=(18+t*(el.clientWidth-36))+'px'}
function invalidate(i){ready[i]=false;correct[i]=false;$('#lane'+i).classList.remove('correct');$('#status'+i).className='status';$('#status'+i).textContent='已更新，請再按準備好了。';document.querySelector(`[data-ready="${i}"]`).textContent='準備好了'}
function submit(i){let s=stages[level],qs=i===0?s.left:s.right;if(i!==1&&qs.some((q,j)=>answers[i][j]===undefined)){$('#status'+i).textContent='還有題目沒有選擇，請全部完成。';return}ready[i]=true;$('#status'+i).textContent='已準備，等待另外兩位。';document.querySelector(`[data-ready="${i}"]`).textContent='已準備 ✓';if(ready.every(Boolean))validateAll();else $('#message').textContent=`${ready.filter(Boolean).length}/3 位已準備好；完成的人可以協助隊友討論。`}
function laneValid(i){let s=stages[level];return i===1?s.sliders.every((v,j)=>Math.abs(values[j]-v.target)<=v.tol+1e-8):(i===0?s.left:s.right).every((q,j)=>answers[i][j]===q.answer)}
function validateAll(){correct=[0,1,2].map(laneValid);correct.forEach((ok,i)=>{let stat=$('#status'+i);stat.className='status '+(ok?'good':'bad');stat.textContent=ok?'✓ 任務正確！可以協助隊友。':'再檢查一下此區答案，修正後重新準備。';$('#lane'+i).classList.toggle('correct',ok);if(!ok){ready[i]=false;document.querySelector(`[data-ready="${i}"]`).textContent='修正後再準備'}});if(correct.every(Boolean)){passed=true;if(scores[level]===0)scores[level]=2;$('#score').textContent=scores.reduce((a,b)=>a+b,0);$('#next').disabled=false;$('#message').textContent='過關！'+stages[level].explain;$('#progress .active').textContent='✓ '+(level+1)+' '+stages[level].name}else $('#message').textContent='先保留正確區域的答案，合作修正標示的區域。教師可提供提示。'}
function updatePlot(){let p=$('#plot');if(!p)return;let svg='';if(level===4){let x=values[0]*PI/180,w=98*Math.cos(x),h=98*Math.sin(x),len=100*Math.cos(x),wid=100*Math.sin(x);svg=`<circle cx="230" cy="120" r="98" fill="none" stroke="#59718b" stroke-width="2"/><line x1="${230-w}" y1="${120+h}" x2="${230+w}" y2="${120-h}" stroke="#91a6bc" stroke-dasharray="6 5"/><rect x="${230-w}" y="${120-h}" width="${2*w}" height="${2*h}" fill="#4de2cb15" stroke="#4de2cb" stroke-width="3"/><circle cx="${230+w}" cy="${120-h}" r="13" fill="#4de2cb" stroke="#d2fff7" stroke-width="3"/><text x="16" y="24" fill="#c2d4e9" font-size="15">直徑 100 cm</text><text x="16" y="217" fill="#4de2cb" font-size="17">周長 ${(2*(len+wid)).toFixed(1)} cm</text><text x="290" y="217" fill="#c2d4e9" font-size="15">x = ${values[0]}°</text><text x="15" y="45" fill="#aabbd2" font-size="14">長 ${len.toFixed(1)}・寬 ${wid.toFixed(1)}</text>`;p.innerHTML=svg;return}
 let xmin=0,xmax=level===3?PI:2*PI,ymin=level===2?-6:level===3?0:-3,ymax=level===2?6:level===3?8:3;const X=x=>40+(x-xmin)/(xmax-xmin)*396,Y=y=>208-(y-ymin)/(ymax-ymin)*184,path=f=>{let pts=[];for(let i=0;i<=200;i++){let x=xmin+(xmax-xmin)*i/200;pts.push((i?'L':'M')+X(x).toFixed(2)+','+Y(f(x)).toFixed(2))}return pts.join('')};for(let i=0;i<=4;i++){let y=ymin+(ymax-ymin)*i/4;svg+=`<line x1="40" x2="436" y1="${Y(y)}" y2="${Y(y)}" stroke="#263b51"/><text x="32" y="${Y(y)+5}" text-anchor="end" fill="#b3c8dd" font-size="13">${Number(y.toFixed(1))}</text>`}for(let i=0;i<=4;i++){let x=xmax*i/4;svg+=`<line x1="${X(x)}" x2="${X(x)}" y1="24" y2="208" stroke="#263b51"/><text x="${X(x)}" y="230" text-anchor="middle" fill="#b3c8dd" font-size="13">${angle(i,level===3?4:2)}</text>`}svg+=`<line x1="40" x2="436" y1="${Y(0)}" y2="${Y(0)}" stroke="#59718b"/>`;
 const curve=(f,c,dashed=false)=>`<path d="${path(f)}" fill="none" stroke="${c}" stroke-width="3" ${dashed?'stroke-dasharray="6 5"':''}/>`;
 if(level===0){svg+=curve(x=>Math.sin(x),'#81b8ff')+curve(x=>Math.cos(x),'#ffce6b')+curve(x=>Math.sin(x)+Math.cos(x),'#ffffff',true)+curve(x=>values[0]*Math.sin(x+PI/4),'#4de2cb')}
 if(level===1){svg+=curve(x=>Math.sqrt(3)*Math.sin(x)+Math.cos(x),'#ffffff',true)+curve(x=>2*Math.sin(x-values[0]*PI/12),'#4de2cb')}
 if(level===2){svg+=curve(x=>3*Math.sin(x)-4*Math.cos(x),'#81b8ff');values.forEach((v,i)=>svg+=`<line x1="40" x2="436" y1="${Y(v)}" y2="${Y(v)}" stroke="${i?'#ffce6b':'#4de2cb'}" stroke-width="3" stroke-dasharray="7 4"/>`)}
 if(level===3){let f=x=>Math.sin(x)-Math.sqrt(3)*Math.cos(x)+5;svg+=curve(f,'#81b8ff');values.forEach((v,i)=>{let x=v*PI/6;svg+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y(f(x))}" y2="208" stroke="${i?'#ffce6b':'#4de2cb'}" stroke-dasharray="5 4"/><circle cx="${X(x)}" cy="${Y(f(x))}" r="8" fill="${i?'#ffce6b':'#4de2cb'}"/>`})}p.innerHTML=svg}
function openModal(html){modalReturn=document.activeElement;$('#dialog').innerHTML=html;$('#modal').hidden=false;const focusable=$('#dialog').querySelector('input,button');if(focusable)focusable.focus()}
function closeModal(){$('#modal').hidden=true;if(modalReturn&&modalReturn.isConnected)modalReturn.focus()}
function showHelp(initial=false){openModal(`<h2 id="modalTitle">三人合作，五關探險</h2><p><span class="pill">公式師</span><span class="pill">圖形師</span><span class="pill">驗證師</span></p><ol><li>三人各站一區，可同時點選、拖動滑桿。</li><li>完成自己的任務，按「準備好了」。三人都準備後一起判定。</li><li>答錯可修正；每關輪換位置，三人都練到不同任務。</li><li>每關完成得 2 分，教師可依口頭解釋再加 1 分。滿分 15 分，時間只供參考。</li></ol>${initial?'<label>小隊名稱（可保留預設）<input id="teamInput" maxlength="20" value="探索小隊"></label>':''}<p class="note">建議使用橫向全螢幕。手機會改成上下排列，適合預習；三人同時操作請使用互動大螢幕。</p><div class="actions"><button class="primary" id="helpClose">${initial?'開始探險':'返回遊戲'}</button></div>`);$('#helpClose').onclick=()=>{if(initial){team=$('#teamInput').value.trim()||'探索小隊';$('#teamLabel').textContent=team;started=true}closeModal()}}
function showTeacher(){openModal(`<h2 id="modalTitle">教師控制 · 第 ${level+1} 關</h2><p>合作完成每關得 2 分。學生能口頭解釋關鍵理由，可再加 1 分。</p><div class="actions" style="justify-content:flex-start"><button id="hintBtn">顯示提示</button><button id="answerBtn">顯示解答</button><button id="bonusBtn" ${!passed||bonuses[level]?'disabled':''}>${bonuses[level]?'本關已加分':'口頭解釋 +1 分'}</button><button id="resetBtn">重新開始整場</button></div><div id="teacherAnswer" class="hint" hidden></div><p class="note">顯示解答會讓三位學生都看見；此控制面板沒有密碼。</p><div class="actions"><button id="teacherClose" class="primary">返回遊戲</button></div>`);$('#teacherClose').onclick=closeModal;$('#hintBtn').onclick=()=>{$('#hint').textContent='提示：'+stages[level].hint;$('#hint').hidden=false;closeModal()};$('#answerBtn').onclick=()=>{let s=stages[level];$('#teacherAnswer').hidden=false;$('#teacherAnswer').textContent=s.explain+' 圖形區設定：'+s.sliders.map(v=>v.label+' = '+v.format(v.target)).join('；')};$('#bonusBtn').onclick=()=>{if(passed&&!bonuses[level]){bonuses[level]=true;scores[level]++;$('#score').textContent=scores.reduce((a,b)=>a+b,0);closeModal()}};$('#resetBtn').onclick=()=>{openModal('<h2 id="modalTitle">重新開始？</h2><p>將清除本場積分、作答與計時。</p><div class="actions"><button id="cancelReset">取消</button><button id="confirmReset" class="primary">確定重新開始</button></div>');$('#cancelReset').onclick=showTeacher;$('#confirmReset').onclick=()=>{level=0;scores=[0,0,0,0,0];bonuses=[false,false,false,false,false];seconds=0;started=false;paused=false;$('#paused').hidden=true;$('#clock').textContent='00:00';resetStage();closeModal();showHelp(true)}}}
function summary(){started=false;openModal(`<div class="summary"><h2 id="modalTitle">五關完成！</h2><p id="summaryTeam"></p><div class="big-score">${scores.reduce((a,b)=>a+b,0)} <span style="font-size:1.3rem">/ 15 分</span></div><p>合作用時 ${Math.floor(seconds/60)} 分 ${seconds%60} 秒</p>${stages.map((s,i)=>`<div class="result-row"><span>${i+1}. ${s.name}</span><strong>${scores[i]} / 3 分</strong></div>`).join('')}<p>你們已完成：疊合、振幅、極值、範圍檢查與幾何應用。</p><div class="actions"><button id="finishBack">返回最後一關</button><button id="replay" class="primary">換一組，重新挑戰</button></div></div>`);$('#summaryTeam').textContent=team;$('#finishBack').onclick=closeModal;$('#replay').onclick=()=>{level=0;scores=[0,0,0,0,0];bonuses=[false,false,false,false,false];seconds=0;$('#clock').textContent='00:00';resetStage();closeModal();showHelp(true)}}
$('#next').onclick=()=>{if(!passed)return;if(level===4)summary();else{level++;resetStage()}};$('#help').onclick=()=>showHelp(false);$('#teacher').onclick=showTeacher;$('#pause').onclick=()=>{paused=true;$('#paused').hidden=false;$('#resume').focus()};$('#resume').onclick=()=>{paused=false;$('#paused').hidden=true;$('#pause').focus()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#message').textContent='此瀏覽器不支援全螢幕，可在電腦按 F11。'}};document.addEventListener('fullscreenchange',()=>{$('#fullscreen').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Tab'){let els=[...$('#dialog').querySelectorAll('button:not(:disabled),input')];if(!els.length)return;let first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});window.addEventListener('resize',()=>stages[level].sliders.forEach((s,i)=>updateSlider(i)));setInterval(()=>{if(started&&!paused&&$('#modal').hidden){seconds++;$('#clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}},1000);resetStage();showHelp(true);
</script>
</body>
</html>
